packages:
  - "packages/*"
  - "examples/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: false
  prisma: true
  vue-demi: true
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.0
  - mysql2@3.22.0 || 3.23.1
  - undici@8.10.2 || 8.12.2
  - brace-expansion@5.0.10 || 5.0.11 || 5.0.12
  - glob@14.0.2
  - minimatch@11.0.1
  - effect@3.22.1
overrides:
  brace-expansion: ">=5.0.8"
  "@hono/node-server": ">=2.0.5"
  nanoid: ">=3.3.18"
  postcss: ">=8.5.23"
  source-map-js: ">=1.2.2"
  "@prisma/config>deepmerge-ts": "^8.0.0"
  "@prisma/config>effect": "^3.22.1"
  "mysql2@<3.23.1": "^3.23.1"
  "js-beautify>glob": "^14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
