# Only read by pnpm. These install scripts aren't needed: better-sqlite3 ships
# prebuilt binaries, and esbuild works without its postinstall check.
allowBuilds:
  better-sqlite3: false
  esbuild: false

# This app pins the Verikit release it was created with, so let pnpm install
# it even when it's newer than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - verikit
  - "@verikit/*"

# drizzle-kit's legacy loader pins esbuild 0.18 (GHSA-67mh-4wv8-2f99); use the
# patched esbuild drizzle-kit itself depends on. package.json has the same
# override for npm.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.4"
