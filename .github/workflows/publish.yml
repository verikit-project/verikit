name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Fail closed: the tagged commit must already have every package.json
      # synced to the root version. If `pnpm vsync` wasn't run and committed
      # before tagging, publishing here would either fail on a version that's
      # already on the registry or, worse, publish mismatched versions.
      - run: pnpm vsync --check

      - run: pnpm build

      - run: pnpm smoke-test

      - run: pnpm --filter "./packages/*" publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
