name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads pnpm 11.21.0 from the root package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Fail closed: the tagged commit must already have every package.json
      # synced to the root version. If `pnpm vsync` wasn't run and committed
      # before tagging, publishing here would either fail on a version that's
      # already on the registry or, worse, publish mismatched versions.
      - run: pnpm vsync --check

      - run: pnpm build

      - run: pnpm smoke-test

      - run: pnpm --filter "./packages/*" publish --access public --provenance --no-git-checks
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
