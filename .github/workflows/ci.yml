name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        react-version: [18, 19]

    name: Node ${{ matrix.node-version }} / React ${{ matrix.react-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install React ${{ matrix.react-version }} compatibility deps
        if: matrix.react-version == 18
        run: pnpm --filter @verikit/react add --save-dev --no-lockfile react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage
